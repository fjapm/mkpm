name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install GNU Make 4.3+ (macOS)
        if: runner.os == 'macOS'
        run: brew install make

      # GitHub's arm64 macOS runners are VMs without nested virtualization, so
      # colima/docker can't start there. Use the native oras plugin instead --
      # the dockerized one (+mkpm-oras-docker, the default) is covered on Linux.
      - name: Install ORAS (macOS)
        if: runner.os == 'macOS'
        run: brew install oras

      - name: Use native ORAS plugin (macOS)
        if: runner.os == 'macOS'
        run: printf 'plugins=+mkpm-oras\nmkpm_dir=../../..\n' > test/fixtures/targets/.mkpmrc.local

      - name: Run tests
        env:
          CI: true
          MKPM_REGISTRY_USER: ${{ github.actor }}
          MKPM_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then export MAKE=gmake; fi
          ./run-tests.sh