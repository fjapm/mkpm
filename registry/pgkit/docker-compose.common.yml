services:
  postgres:
    build:
      context: .
    restart: unless-stopped
    environment:
      # Pin the data path explicitly. The PG18 official image changed its
      # default PGDATA layout; setting it here keeps the volume mount stable.
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
      # *.sql / *.sh here run ONCE, only when the data directory is empty.
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./backups:/backups
    # pg_cron MUST be in shared_preload_libraries, and its metadata
    # (the cron.job table) lives in the database named by cron.database_name.
    # These args are also applied to the bootstrap server during first init,
    # so CREATE EXTENSION pg_cron in ./init works without a manual restart.
    # Single $ on purpose: this is exec form, so there is no shell in the
    # container to expand it later. Compose must substitute it here, on the
    # host, reading ./.env (interpolation does not see env_file/.env.local).
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=${POSTGRES_DB}
    ports:
      - "5432:5432"
    labels:
      - main=true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h /var/run/postgresql -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5

  # https://www.pgadmin.org/docs/pgadmin4/latest/container_deployment.html 
  pgadmin:
    image: dpage/pgadmin4
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 80
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json
      - .pgpass:/pgadmin4/.pgpass