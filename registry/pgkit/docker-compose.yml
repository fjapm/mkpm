name: ${pgkit_project_name}

# Use include to import the base docker-compose.yml file from the parent directory. This allows you to reuse common configurations and services defined in the parent file.
# include:
#   - ../docker-compose.yml

# Use the prefix x- as a top-level element to modularize configurations that you want to reuse. 
# Compose ignores any fields that start with x-, this is the sole exception where Compose silently ignores unrecognized fields.
# x-base: &base
#   build:
#     context: .
#   restart: unless-stopped
#   env_file:
#     - .env
#     - .env.local

services:
  postgres:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
      - .env.local
    environment:
      # Pin the data path explicitly. The PG18 official image changed its
      # default PGDATA layout; setting it here keeps the volume mount stable.
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
      # *.sql / *.sh here run ONCE, only when the data directory is empty.
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./backups:/backups
    # See https://hub.docker.com/_/postgres#database-configuration (option 2)
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=${POSTGRES_DB:-postgres}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h /var/run/postgresql -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5

  # https://www.pgadmin.org/docs/pgadmin4/latest/container_deployment.html 
  pgadmin:
    image: dpage/pgadmin4
    env_file:
      - .env
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 80
    labels:
      - traefik.enable=true
      - traefik.http.routers.pgadmin.rule=Host(`pgadmin.localhost`)
      - traefik.http.routers.pgadmin.entrypoints=web
      - traefik.http.services.pgadmin.loadbalancer.server.port=80
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json
      - .pgpass:/pgadmin4/.pgpass

volumes:
  pgdata: